{% extends "base_customer.html" %}

{% block title %}Track a Parcel{% endblock %}

{% block content %}
<section class="track-search">

    <p class="section-label">CUSTOMER</p>

    <h1>Track your parcel</h1>

    <p class="dashboard-subtitle">
        Enter your tracking number to see where your parcel is.
    </p>

    <form action="{{ url_for('customer_page') }}" method="GET" class="search-form">
        <input type="text"
               name="q"
               value="{{ query }}"
               placeholder="e.g. PT1001"
               aria-label="Tracking number"
               required>

        <button type="submit" class="primary-btn search-btn">
            Track
        </button>
    </form>

    {% if error %}
    <p class="error-msg" role="alert">{{ error }}</p>
    {% endif %}

</section>
{% endblock %}
