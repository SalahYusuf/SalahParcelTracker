{% extends "base_customer.html" %}

{% block title %}Receiver{% endblock %}

{% block content %}
<section class="panel">

    <h2>Receiver</h2>

    <dl class="info-grid">
        <div>
            <dt>Name</dt>
            <dd>{{ parcel.receiver }}</dd>
        </div>

        <div>
            <dt>Phone</dt>
            <dd>{{ phone }}</dd>
        </div>

        <div>
            <dt>Delivery area</dt>
            <dd>{{ address }}</dd>
        </div>
    </dl>

    <p class="note">
        Phone and street address are partly hidden to protect the receiver's privacy.
    </p>

</section>
{% endblock %}
