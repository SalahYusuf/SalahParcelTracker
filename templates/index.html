<!doctype html>
<html lang="en">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Salah Parcel Tracker</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='index.css') }}"
    />
    <!-- figma:head-end -->
  </head>

  <body>
    <!-- figma:body-start -->
    <main class="landing">
      <div class="landing-glow" aria-hidden="true"></div>

      <div class="landing-inner">
        <div class="brand" aria-label="Salah Parcel Tracker">
          <div class="brand-mark">
            <svg
              width="33"
              height="33"
              viewBox="0 0 32 32"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m16 3 12 6.5v13L16 29 4 22.5v-13L16 3Z" />
              <path d="m4 9.5 12 6.7 12-6.7M16 16.2V29M10 6.2l12 6.7" />
            </svg>
          </div>

          <div class="brand-name">
            salah<span>.</span>
          </div>

          <div class="brand-descriptor">
            PARCEL TRACKER
          </div>
        </div>

        <fieldset class="role-options">
          <legend class="visually-hidden">
            Choose your role
          </legend>

          <!-- CUSTOMER -->

          <input
            class="role-input"
            type="radio"
            name="role"
            id="customer"
          />

          <label
            class="role-card customer-card"
            for="customer"
          >
            <span
              class="card-art card-art-customer"
              aria-hidden="true"
            ></span>

            <span class="role-icon">
              <svg
                width="27"
                height="27"
                viewBox="0 0 32 32"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m16 3 12 6.5v13L16 29 4 22.5v-13L16 3Z" />
                <path d="m4 9.5 12 6.7 12-6.7M16 16.2V29M10 6.2l12 6.7" />
              </svg>
            </span>

            <span class="role-bottom">
              <span class="role-name">
                Customer
              </span>

              <span class="role-arrow">
                <svg
                  width="23"
                  height="23"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M4 12h15m-6-6 6 6-6 6" />
                </svg>
              </span>
            </span>
          </label>

          <!-- COURIER -->

          <input
            class="role-input"
            type="radio"
            name="role"
            id="courier"
          />

          <label
            class="role-card courier-card"
            for="courier"
          >
            <span
              class="card-art card-art-courier"
              aria-hidden="true"
            ></span>

            <span class="role-icon">
              <svg
                width="31"
                height="31"
                viewBox="0 0 32 32"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M3 8h16v16H3V8ZM19 13h5l5 5v6H19V13Z" />

                <circle
                  cx="9"
                  cy="24"
                  r="2.5"
                  fill="currentColor"
                  stroke="none"
                />

                <circle
                  cx="24"
                  cy="24"
                  r="2.5"
                  fill="currentColor"
                  stroke="none"
                />

                <path d="M7 13h8M7 17h5" />
              </svg>
            </span>

            <span class="role-bottom">
              <span class="role-name">
                Courier
              </span>

              <span class="role-arrow">
                <svg
                  width="23"
                  height="23"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M4 12h15m-6-6 6 6-6 6" />
                </svg>
              </span>
            </span>
          </label>
        </fieldset>
      </div>
    </main>
    <!-- figma:body-end -->

    <script>
      const customerCard = document.querySelector(".customer-card");
      const courierCard = document.querySelector(".courier-card");

      customerCard.addEventListener("click", () => {
        window.location.href = "/customer";
      });

      courierCard.addEventListener("click", () => {
        window.location.href = "/courier";
      });
    </script>
  </body>
</html>
